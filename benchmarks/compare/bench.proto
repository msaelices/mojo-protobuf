syntax = "proto3";
package cmp;

import "google/protobuf/timestamp.proto";

// Packed repeated int64: the bulk-numeric decode hot path.
message Packed {
  repeated int64 values = 1;
}

// A typical record: strings + mixed scalars + a nested message. No SIMD path —
// dominated by String allocation/UTF-8 validation, where the mature libs lead.
message Address {
  string street = 1;
  string city = 2;
  string country = 3;
}

message Person {
  int64 id = 1;
  string name = 2;
  string email = 3;
  bool active = 4;
  double balance = 5;
  int32 age = 6;
  Address address = 7;
}

// --- Carved from livekit/protocol livekit_models.proto: ParticipantInfo
// + TrackInfo and their same-file dependency closure. Custom (logger.*) and
// deprecated field options are stripped (they do not affect the wire
// format); message and field numbers are verbatim from the real schema.

enum TrackType {
  AUDIO = 0;
  VIDEO = 1;
  DATA = 2;
}

enum TrackSource {
  UNKNOWN = 0;
  CAMERA = 1;
  MICROPHONE = 2;
  SCREEN_SHARE = 3;
  SCREEN_SHARE_AUDIO = 4;
}

enum VideoQuality {
  LOW = 0;
  MEDIUM = 1;
  HIGH = 2;
  OFF = 3;
}

enum AudioTrackFeature {
  TF_STEREO = 0;
  TF_NO_DTX = 1;
  TF_AUTO_GAIN_CONTROL = 2;
  TF_ECHO_CANCELLATION = 3;
  TF_NOISE_SUPPRESSION = 4;
  TF_ENHANCED_NOISE_CANCELLATION = 5;
  TF_PRECONNECT_BUFFER = 6;
}

enum BackupCodecPolicy {
  PREFER_REGRESSION = 0;
  SIMULCAST = 1;
  REGRESSION = 2;
}

enum PacketTrailerFeature {
  PTF_USER_TIMESTAMP = 0;
  PTF_FRAME_ID = 1;
}

enum DisconnectReason {
  UNKNOWN_REASON = 0;
  CLIENT_INITIATED = 1;
  DUPLICATE_IDENTITY = 2;
  SERVER_SHUTDOWN = 3;
  PARTICIPANT_REMOVED = 4;
  ROOM_DELETED = 5;
  STATE_MISMATCH = 6;
  JOIN_FAILURE = 7;
  MIGRATION = 8;
  SIGNAL_CLOSE = 9;
  ROOM_CLOSED = 10;
  USER_UNAVAILABLE = 11;
  USER_REJECTED = 12;
  SIP_TRUNK_FAILURE = 13;
  CONNECTION_TIMEOUT = 14;
  MEDIA_FAILURE = 15;
  AGENT_ERROR = 16;
}

message TimedVersion {
  int64 unix_micro = 1;
  int32 ticks = 2;
}

message Encryption {
  enum Type {
    NONE = 0;
    GCM = 1;
    CUSTOM = 2;
  }
}

message VideoLayer {
  enum Mode {
    MODE_UNUSED = 0;
    ONE_SPATIAL_LAYER_PER_STREAM = 1;
    MULTIPLE_SPATIAL_LAYERS_PER_STREAM = 2;
    ONE_SPATIAL_LAYER_PER_STREAM_INCOMPLETE_RTCP_SR = 3;
  }
  VideoQuality quality = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 bitrate = 4;
  uint32 ssrc = 5;
  int32 spatial_layer = 6;
  string rid = 7;
  uint32 repair_ssrc = 8;
}

message SimulcastCodecInfo {
  string mime_type = 1;
  string mid = 2;
  string cid = 3;
  repeated VideoLayer layers = 4;
  VideoLayer.Mode video_layer_mode = 5;
  string sdp_cid = 6;
}

message ParticipantPermission {
  bool can_subscribe = 1;
  bool can_publish = 2;
  bool can_publish_data = 3;
  repeated TrackSource can_publish_sources = 9;
  bool hidden = 7;
  bool recorder = 8;
  bool can_update_metadata = 10;
  bool agent = 11;
  bool can_subscribe_metrics = 12;
  bool can_manage_agent_session = 13;
}

message DataTrackInfo {
  uint32 pub_handle = 1;
  string sid = 2;
  string name = 3;
  Encryption.Type encryption = 4;
}

message TrackInfo {
  string sid = 1;
  TrackType type = 2;
  string name = 3;
  bool muted = 4;
  uint32 width = 5;
  uint32 height = 6;
  bool simulcast = 7;
  bool disable_dtx = 8;
  TrackSource source = 9;
  repeated VideoLayer layers = 10;
  string mime_type = 11;
  string mid = 12;
  repeated SimulcastCodecInfo codecs = 13;
  bool stereo = 14;
  bool disable_red = 15;
  Encryption.Type encryption = 16;
  string stream = 17;
  TimedVersion version = 18;
  repeated AudioTrackFeature audio_features = 19;
  BackupCodecPolicy backup_codec_policy = 20;
  repeated PacketTrailerFeature packet_trailer_features = 21;
}

message ParticipantInfo {
  enum State {
    JOINING = 0;
    JOINED = 1;
    ACTIVE = 2;
    DISCONNECTED = 3;
  }
  enum Kind {
    STANDARD = 0;
    INGRESS = 1;
    EGRESS = 2;
    SIP = 3;
    AGENT = 4;
    CONNECTOR = 7;
    BRIDGE = 8;
  }
  enum KindDetail {
    CLOUD_AGENT = 0;
    FORWARDED = 1;
    CONNECTOR_WHATSAPP = 2;
    CONNECTOR_TWILIO = 3;
    BRIDGE_RTSP = 4;
  }
  string sid = 1;
  string identity = 2;
  State state = 3;
  repeated TrackInfo tracks = 4;
  string metadata = 5;
  int64 joined_at = 6;
  int64 joined_at_ms = 17;
  string name = 9;
  uint32 version = 10;
  ParticipantPermission permission = 11;
  string region = 12;
  bool is_publisher = 13;
  Kind kind = 14;
  map<string, string> attributes = 15;
  DisconnectReason disconnect_reason = 16;
  repeated KindDetail kind_details = 18;
  repeated DataTrackInfo data_tracks = 19;
  int32 client_protocol = 20;
}

// --- RTPStats carved from livekit_models.proto (the four RTPDrift
// fields dropped to stay self-contained): a numeric-heavy message with
// six google.protobuf.Timestamp fields and a map, verbatim field numbers.

message RtpStats {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  double duration = 3;
  uint32 packets = 4;
  double packet_rate = 5;
  uint64 bytes = 6;
  uint64 header_bytes = 39;
  double bitrate = 7;
  uint32 packets_lost = 8;
  double packet_loss_rate = 9;
  float packet_loss_percentage = 10;
  uint32 packets_duplicate = 11;
  double packet_duplicate_rate = 12;
  uint64 bytes_duplicate = 13;
  uint64 header_bytes_duplicate = 40;
  double bitrate_duplicate = 14;
  uint32 packets_padding = 15;
  double packet_padding_rate = 16;
  uint64 bytes_padding = 17;
  uint64 header_bytes_padding = 41;
  double bitrate_padding = 18;
  uint32 packets_out_of_order = 19;
  uint32 frames = 20;
  double frame_rate = 21;
  double jitter_current = 22;
  double jitter_max = 23;
  map<int32, uint32> gap_histogram = 24;
  uint32 nacks = 25;
  uint32 nack_acks = 37;
  uint32 nack_misses = 26;
  uint32 nack_repeated = 38;
  uint32 plis = 27;
  google.protobuf.Timestamp last_pli = 28;
  uint32 firs = 29;
  google.protobuf.Timestamp last_fir = 30;
  uint32 rtt_current = 31;
  uint32 rtt_max = 32;
  uint32 key_frames = 33;
  google.protobuf.Timestamp last_key_frame = 34;
  uint32 layer_lock_plis = 35;
  google.protobuf.Timestamp last_layer_lock_pli = 36;
}
