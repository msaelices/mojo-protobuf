[project]
name = "mojo-protobuf"
version = "0.1.0"
description = "A pure-Mojo Protocol Buffers implementation"
authors = ["Manuel Saelices <msaelices@gmail.com>"]
channels = ["conda-forge", "https://conda.modular.com/max-nightly"]
platforms = ["linux-64", "osx-arm64"]
license = "MIT"
readme = "README.md"

[dependencies]
max = "*"
protobuf = "*"
libprotobuf = "*"

[tasks]
test-wire = "mojo run -I src test/test_wire.mojo"
test-fields = "mojo run -I src test/test_fields.mojo"
test-message = "mojo run -I src test/test_message.mojo"
test-size = "mojo run -I src test/test_size.mojo"
codegen-gen = "protoc -I test/proto --plugin=protoc-gen-mojo=codegen/protoc-gen-mojo --mojo_out=test/gen example.proto telem.proto"
test-codegen-unit = "python3 codegen/test_protoc_gen_mojo.py"
test-codegen = { cmd = "mojo run -I src -I test/gen test/test_codegen.mojo", depends-on = ["codegen-gen"] }
test-interop = { cmd = "python3 test/test_interop.py", depends-on = ["codegen-gen"] }
test = { depends-on = ["test-wire", "test-fields", "test-message", "test-size", "test-codegen-unit", "test-codegen", "test-interop"] }
bench-wire = "mojo run -I src benchmarks/bench_wire.mojo"
bench-message = "mojo run -I src benchmarks/bench_message.mojo"
bench = { depends-on = ["bench-wire", "bench-message"] }
format = "mojo format ./"
